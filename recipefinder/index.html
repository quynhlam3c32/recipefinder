<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <script type="module" src="assets/js/index.js" defer></script>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Recipe Page</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="recipes.html">Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit_recipes.html">Submit Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saved.html">Saved</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">Contact</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="auth-links">
                    
                </ul>
            </div>
        </div>
    </nav>

  
    <div class="hero-section">
        <div class="content d-flex">
      
            <div class="search-section">
                <h2>Find Recipes</h2>
                
              
                <form id="ingredientForm">
                    <div id="ingredientInputContainer" class="position-relative">
                        <div id="ingredientTags" class="tags-container"></div>
                        <input type="text" id="ingredients" class="form-control" placeholder="Type an ingredient and press Enter" autocomplete="off">
                        <div id="suggestionBox" class="suggestion-box"></div>
                    </div>
                    
                    
                    
                </form>

         
                <div class="d-flex align-items-center mt-3">
                    <select id="preferences" class="form-select me-2">
                        <option value="All">All</option>
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Vegan">Vegan</option>
                        <option value="Gluten-Free">Gluten-Free</option>
                        <option value="Low-Carb">Low-Carb</option>
                        <option value="High-Protein">High-Protein</option>
                    </select>
                    <input type="number" id="calories" class="form-control me-2" placeholder="Max Calories">
                    <button type="button" class="btn btn-secondary" id="applyFiltersBtn">Apply Filters</button>

                </div>

                <!-- Recipe Results -->
                <div id="recipeResults" class="mt-4"></div> 
           </div>  

         
            <div class="right-content">
                <div class="image-container">
                    <img src="assets/img/file.png" alt="Salad Image" class="salad-image">
                    <div class="text-overlay">
                        <h2>Salad</h2>
                        <p>10-15 mins</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="curved-background"></div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
