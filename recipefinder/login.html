<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder - Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">
    <script type="module" src="assets/js/login.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Recipe Page</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="recipes.html">Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="submit_recipes.html">Submit Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">Contact</a>
                    </li>
                    
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Sign Up</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Log In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="content">
            <div class="login-form">
                <h2>Log In</h2>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="button" class="btn btn-primary" id="submit">Log In</button>
                    </div>

                    <div class="mt-3 text-center">
                        <a href="#" id="forgot-password">Forgot Password?</a>
                    </div>

                    <div class="mt-3 text-center">
                        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                    </div>
                </form>

                <!-- Forgot Password Section -->
                <div id="forgot-password-section" style="display:none;">
                    <h3>Reset Your Password</h3>
                    <p>Please enter your email address to reset your password.</p>
                    <form id="reset-password-form">
                        <div class="mb-3">
                            <input type="email" class="form-control" id="reset-email" placeholder="Enter your email" required>
                        </div>
                        <button type="button" class="btn btn-primary" id="reset-password-btn">Send Reset Link</button>
                        <div class="mt-3">
                            <a href="#" id="back-to-login">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="curved-background"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
