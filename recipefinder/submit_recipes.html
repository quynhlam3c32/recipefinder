<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Recipe Finder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="recipes.html">Recipes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="submit_recipes.html">Submit Recipes</a> <!-- Current page -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saved.html">Saved</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacts.html">Contact</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="signup.html">Sign Up</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Log In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="text-center mt-5 pt-5">
        <h1>Submit Your Recipe</h1>
        <p>Share your favorite recipe with the world!</p>
    </header>

    <section class="container mt-4">
        <form id="submit-recipe-form">
            <div class="mb-3">
                <label for="recipeName" class="form-label">Recipe Name</label>
                <input type="text" class="form-control" id="recipeName" name="recipeName" required>
            </div>

            <div class="mb-3">
                <label for="ingredients" class="form-label">Ingredients</label>
                <textarea class="form-control" id="ingredients" name="ingredients" rows="4" required></textarea>
                <small class="form-text text-muted">Separate ingredients with commas (e.g., chicken, garlic, tomatoes)</small>
            </div>

            <div class="mb-3">
                <label for="instructions" class="form-label">Instructions</label>
                <textarea class="form-control" id="instructions" name="instructions" rows="6" required></textarea>
            </div>

            <div class="mb-3">
                <label for="cookingTime" class="form-label">Cooking Time (in minutes)</label>
                <input type="number" class="form-control" id="cookingTime" name="cookingTime" required>
            </div>
            <div class="mb-3">
                <label for="Total Calories" class="form-label">Total Calories</label>
                <input type="number" class="form-control" id="calories" name="calories" required>
            </div>

            <div class="mb-3">
                <label for="recipeImage" class="form-label">Recipe Image</label>
                <input type="file" class="form-control" id="recipeImage" name="recipeImage" accept="image/*">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Submit Recipe</button>
            </div>
        </form>
    </section>

    <footer class="text-center mt-4">
        <p>&copy; 2024 Recipe Finder. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('submit-recipe-form').addEventListener('submit', function(event) {
            event.preventDefault();
           
            alert('Recipe Submitted Successfully!');
        });
    </script>
</body>
</html>
